name: Uusi uutinen
description: Julkaise uutinen Paimensaaren sivuille
labels: ["uutinen"]
body:
  - type: markdown
    attributes:
      value: |
        Yläreunan **Add a title** on uutisen otsikko — se näkyy sivustolla
        sellaisenaan. Jos uutinen koskee tapahtumaa, kirjoita tapahtuman
        ajankohta otsikkoon, esimerkiksi *Talkoot 10.10. klo 12*.
        Alempi Päivämäärä-kenttä on eri asia: se kertoo, milloin uutinen on
        kirjoitettu, ja sen mukaan uutiset järjestyvät sivustolla.

        Täytä sen jälkeen teksti ja kuvat, ja paina lopuksi vihreää
        **Create**-painiketta.
        Uutinen ilmestyy sivuille noin minuutin kuluessa, ja saat tähän
        vahvistuksen linkin kanssa.
  - type: input
    id: paivamaara
    attributes:
      label: Päivämäärä
      description: >
        Milloin uutinen on kirjoitettu — ei tapahtuman päivämäärä.
        Tapahtuman ajankohta kirjoitetaan otsikkoon ja tekstiin.
        Yleensä tämä kenttä on jo valmiina; tyhjänä käytetään kuluvaa päivää.
      placeholder: esim. 25.10.2026
  - type: textarea
    id: teksti
    attributes:
      label: Uutisen teksti
      description: Tavallista tekstiä. Tyhjä rivi aloittaa uuden kappaleen.
      placeholder: |
        Syyssiivous- ja polttopuutalkoot pidettiin lauantaina rantasaunalla.

        Pientä suupalaa oli tarjolla ja saunat kuumana. Kiitos ahkeroijille!
    validations:
      required: true
  - type: textarea
    id: kuvat
    attributes:
      label: Kuvat
      description: >
        Raahaa valokuvat tähän kenttään tai liitä ne leikepöydältä.
        Kuvat pienennetään automaattisesti sivustoa varten; alkuperäiset
        säilyvät arkistossa.
      placeholder: Raahaa kuvat tähän.
  - type: checkboxes
    id: poisto
    attributes:
      label: Poistaminen
      description: >
        Kun haluat poistaa jo julkaistun uutisen sivustolta, avaa tämä lomake
        uudelleen, rastita alla oleva ruutu ja tallenna.
      options:
        - label: Poista tämä uutinen sivustolta
