name: Uusi uutinen
description: Julkaise uutinen Paimensaaren sivuille
labels: ["uutinen"]
body:
  - type: markdown
    attributes:
      value: |
        Yläreunan **Add a title** on uutisen otsikko — se näkyy sivustolla
        sellaisenaan. Täytä sen jälkeen teksti ja kuvat, ja paina lopuksi
        vihreää **Create**-painiketta.
        Uutinen ilmestyy sivuille noin minuutin kuluessa, ja saat tähän
        vahvistuksen linkin kanssa.
  - type: input
    id: paivamaara
    attributes:
      label: Päivämäärä
      description: >
        Yleensä tämä on jo valmiina. Tyhjänä käytetään kuluvaa päivää.
        Menneen tapahtuman voi päivätä muodossa 25.10.2026.
      placeholder: esim. 25.10.2026
  - type: textarea
    id: teksti
    attributes:
      label: Uutisen teksti
      description: Tavallista tekstiä. Tyhjä rivi aloittaa uuden kappaleen.
      placeholder: |
        Syyssiivous- ja polttopuutalkoot pidettiin lauantaina rantasaunalla.

        Pientä suupalaa oli tarjolla ja saunat kuumana. Kiitos ahkeroijille!
    validations:
      required: true
  - type: textarea
    id: kuvat
    attributes:
      label: Kuvat
      description: >
        Raahaa valokuvat tähän kenttään tai liitä ne leikepöydältä.
        Kuvat pienennetään automaattisesti sivustoa varten; alkuperäiset
        säilyvät arkistossa.
      placeholder: Raahaa kuvat tähän.
